name: Kitwise Company OS foundation tests

on:
  pull_request:
    paths:
      - 'company_os/**'
      - 'tests/test_company_os.py'
      - 'docs/company-os/**'
      - '.github/workflows/company-os-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-os-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run Company OS unit tests without credentials
        run: python -m unittest discover -s tests -p 'test_company_os.py' -v
      - name: Smoke test deterministic CEO-to-Research flow
        run: python -m company_os --mode fixture --db "$RUNNER_TEMP/company-os.sqlite3" --report "$RUNNER_TEMP/board-report.json" > /dev/null
