name: Kitwise Cloud Research Pilot tests

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/company-os-cloud-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test Cloudflare Worker without network or credentials
        run: node --test cloudflare/tests/*.test.mjs
      - name: Validate database SQL via local SQLite
        run: python -c "import sqlite3,pathlib; db=sqlite3.connect(':memory:'); [db.executescript(p.read_text()) for p in sorted(pathlib.Path('cloudflare/migrations').glob('*.sql'))]; assert db.execute('select name from pragma_table_info(\"curated_research_runs\") where name=\"retry_count\"').fetchone() is not None; assert db.execute('select name from sqlite_master where name=\"production_jobs\"').fetchone() is not None"
