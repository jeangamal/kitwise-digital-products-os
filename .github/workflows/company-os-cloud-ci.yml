name: Kitwise Cloud Research Pilot tests

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/company-os-cloud-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test Cloudflare Worker without network or credentials
        run: node --test cloudflare/tests/*.test.mjs
      - name: Validate database SQL via local SQLite
        run: python -c "import sqlite3; db=sqlite3.connect(':memory:'); db.executescript(open('cloudflare/migrations/0001_research.sql').read()); db.executescript(open('cloudflare/migrations/0002_market_intelligence.sql').read()); db.executescript(open('cloudflare/migrations/0003_market_research_retry.sql').read()); db.executescript(open('cloudflare/migrations/0004_indexed_research.sql').read()); db.executescript(open('cloudflare/migrations/0005_curated_research.sql').read()); assert db.execute('select name from pragma_table_info(\"curated_research_runs\") where name=\"retry_count\"').fetchone() is not None"
