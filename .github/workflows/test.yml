name: Kitwise verification

on:
  push:
    paths-ignore:
      - '.kitwise/**'
  pull_request:
    paths-ignore:
      - '.kitwise/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
      - name: Verify validation, encryption, persistence and duplicate protection
        run: python -m unittest discover -s tests -v
      - name: Run the complete pipeline against a local test inbox
        run: python tools/demo.py
