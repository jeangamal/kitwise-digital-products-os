name: Kitwise scheduled uploads

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check files without transferring, or upload to contributor inboxes
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - check-connections
          - upload
  push:
    paths:
      - '.github/workflows/kitwise.yml'

permissions:
  contents: write

concurrency:
  group: kitwise-transfers
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KITWISE_ENABLED: ${{ vars.KITWISE_ENABLED }}
      KITWISE_BATCH_SIZE: ${{ vars.KITWISE_BATCH_SIZE || '10' }}
      REQUESTED_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check connections without exposing secret values
        id: readiness
        env:
          KITWISE_STATE_KEY: ${{ secrets.KITWISE_STATE_KEY }}
          KITWISE_GOOGLE_CREDENTIALS: ${{ secrets.KITWISE_GOOGLE_CREDENTIALS }}
          KITWISE_DRIVE_FOLDER_ID: ${{ secrets.KITWISE_DRIVE_FOLDER_ID }}
          KITWISE_TARGETS_JSON: ${{ secrets.KITWISE_TARGETS_JSON }}
        run: python3 tools/readiness.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install free dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
      - name: Check files or transfer the next batch
        if: steps.readiness.outputs.ready == 'true'
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          KITWISE_STATE_KEY: ${{ secrets.KITWISE_STATE_KEY }}
          KITWISE_GOOGLE_CREDENTIALS: ${{ secrets.KITWISE_GOOGLE_CREDENTIALS }}
          KITWISE_DRIVE_FOLDER_ID: ${{ secrets.KITWISE_DRIVE_FOLDER_ID }}
          KITWISE_TARGETS_JSON: ${{ secrets.KITWISE_TARGETS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$REQUESTED_MODE" == "check-connections" ]]; then
            python -m kitwise connections
          elif [[ "$EVENT_NAME" == "schedule" || "$REQUESTED_MODE" == "upload" ]]; then
            python -m kitwise run
          else
            python -m kitwise run --dry-run
          fi
